name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff (lint + format check)
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Run MyPy (type checking)
        run: |
          mypy src/mcp_research_agent_system

      - name: Run pytest (unit + integration tests)
        run: |
          pytest -v --tb=short
        env:
          # Ensure no real network calls in CI
          LLM_API_KEY: "dummy-key-for-ci"
          LLM_BASE_URL: "http://localhost:20128/v1"
          LLM_MODEL: "gpt-4o-mini"
          RESEARCH_AGENT_DB_PATH: ":memory:"
          LOG_DIR: "/tmp/logs"

      # Optional: Run with coverage (uncomment if desired)
      # - name: Run pytest with coverage
      #   run: |
      #     pytest -v --tb=short --cov=src/mcp_research_agent_system --cov-report=term-missing --cov-fail-under=80
      #   env:
      #     LLM_API_KEY: "dummy-key-for-ci"
      #     LLM_BASE_URL: "http://localhost:20128/v1"
      #     LLM_MODEL: "gpt-4o-mini"
      #     RESEARCH_AGENT_DB_PATH: ":memory:"
      #     LOG_DIR: "/tmp/logs"